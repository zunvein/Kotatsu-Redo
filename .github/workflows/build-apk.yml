name: Build & publish release

on:
  workflow_dispatch:
  push:
    branches: [ devel ]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble, sign and publish release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute build date
        run: echo "FORK_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build signed release APKs (per-ABI + universal)
        run: |
          set -o pipefail
          # D8 (R8 8.13) cannot parse Kotlin 2.2 metadata and prints a warning plus a full
          # stack trace for every class - ~1k warnings, ~160k log lines. Harmless, so the
          # noise is collapsed into a single counter line.
          ./gradlew assembleRelease -PforkBuildDate="$FORK_DATE" --no-daemon --stacktrace 2>&1 | awk '
            /^WARNING: D8:/ { suppressed++; skip = 1; next }
            skip && (/^[ \t]/ || /^com\.android\.tools\.r8/) { next }
            { skip = 0; print }
            END {
              if (suppressed) printf "\n[ci] %d D8 Kotlin-metadata warnings suppressed (D8 8.13 vs Kotlin 2.2, harmless)\n", suppressed
            }
          '

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Single source of truth for the version: app/build.gradle (forkVersion).
          FORK_VER="$(grep -oP "^def forkVersion = '\K[^']+" app/build.gradle)"
          [ -n "$FORK_VER" ] || { echo "failed to read forkVersion from app/build.gradle"; exit 1; }
          VER="v${FORK_VER}"
          mkdir -p release-apks
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a*) abi="arm64-v8a" ;;
              *armeabi-v7a*) abi="armeabi-v7a" ;;
              *) abi="universal" ;;
            esac
            cp "$f" "release-apks/KotatsuRedo-${FORK_VER}-${abi}.apk"
          done
          {
            cat RELEASE_NOTES.md
            echo
            echo '---'
            echo "**Which APK?** \`arm64-v8a\` for modern phones, \`armeabi-v7a\` for older devices, \`universal\` works everywhere. In-app updates download the universal APK."
          } > release-notes.md
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release delete "$VER" --yes --cleanup-tag
          fi
          gh release create "$VER" release-apks/*.apk --title "$FORK_VER" --notes-file release-notes.md --latest
