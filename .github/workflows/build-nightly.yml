name: Build nightly APK

on:
  workflow_dispatch:

concurrency:
  group: apk-nightly
  cancel-in-progress: true

jobs:
  build:
    name: Assemble signed nightly APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build signed nightly APK
        run: |
          set -o pipefail
          ./gradlew assembleNightly --no-daemon --stacktrace 2>&1 | awk '
            /^WARNING: D8:/ { suppressed++; skip = 1; next }
            skip && (/^[ \t]/ || /^com\.android\.tools\.r8/) { next }
            { skip = 0; print }
            END {
              if (suppressed) printf "\n[ci] %d D8 Kotlin-metadata warnings suppressed (D8 8.13 vs Kotlin 2.2, harmless)\n", suppressed
            }
          '

      - name: Upload nightly APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: KotatsuRedo-nightly-apk
          path: app/build/outputs/apk/nightly/*.apk
          if-no-files-found: error
          retention-days: 7
